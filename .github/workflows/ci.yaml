name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://app:password@localhost:5432/app

      - name: Replay migrations from an empty database
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://app:password@localhost:5432/app

      - run: pnpm lint

      - run: pnpm lint:tw

      - run: pnpm type-check

      - run: pnpm test
        env:
          DATABASE_URL: postgresql://app:password@localhost:5432/app

      - run: pnpm knip

      - run: pnpm build
        env:
          DATABASE_URL: postgresql://app:password@localhost:5432/app
          BETTER_AUTH_SECRET: ci-build-secret-not-for-production
