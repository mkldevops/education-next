name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yaml
      - package.json
      - pnpm-lock.yaml
      - prisma/**
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test migrations and boot
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgresql://app:password@localhost:5432/app \
            -e BETTER_AUTH_SECRET=ci-smoke-secret-not-for-production \
            -e NEXT_PUBLIC_APP_URL=https://smoke.example.test \
            -e HOSTNAME=0.0.0.0 \
            "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/robots.txt | grep -q "smoke.example.test/sitemap.xml" \
              && docker exec app wget -qO /dev/null http://localhost:3000/robots.txt && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - run: docker push "$IMAGE:${{ github.sha }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      checks: read

    steps:
      - name: Wait for CI on this commit
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.sha }}
          check-name: quality
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${{ github.sha }}"

      - name: Roll out on Coolify
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUIDS: ${{ vars.COOLIFY_APP_UUIDS }}
        run: |
          set -euo pipefail
          for uuid in ${APP_UUIDS//,/ }; do
            curl -fsS -X PATCH "$COOLIFY_URL/api/v1/applications/$uuid" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"docker_registry_image_tag\":\"${{ github.sha }}\"}" > /dev/null
          done
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUIDS" -H "Authorization: Bearer $COOLIFY_TOKEN"
